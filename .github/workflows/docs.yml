name: Deploy Documentation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for git info plugin
        
    - name: Configure Git Credentials
      run: |
        git config user.name github-actions[bot]
        git config user.email github-actions[bot]@users.noreply.github.com
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install "mkdocs>=1.6.0,<2" "mkdocs-material>=9.5.0,<10" "mkdocs-mermaid2-plugin>=1.2.1,<2" "mkdocs-git-revision-date-localized-plugin>=1.4.7,<2" "pymdown-extensions>=10.12.0,<11"
        
    - name: Deploy to GitHub Pages
      run: mkdocs gh-deploy --force
      
  build-only:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install "mkdocs>=1.6.0,<2" "mkdocs-material>=9.5.0,<10" "mkdocs-mermaid2-plugin>=1.2.1,<2" "mkdocs-git-revision-date-localized-plugin>=1.4.7,<2" "pymdown-extensions>=10.12.0,<11"
        
    - name: Build documentation
      run: mkdocs build