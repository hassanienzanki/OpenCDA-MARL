description: |-
  CARLA-SUMO co-simulation MARL experiment defaults.
  This family is reserved for co-simulation-focused experiments so CARLA-only
  and SUMO-only configs can evolve independently.

world:
  sync_mode: true
  host: 127.0.0.1
  client_port: 2000
  timeout: 20.0
  fixed_delta_seconds: 0.05
  seed: 11
  weather:
    sun_altitude_angle: 15
    cloudiness: 0
    precipitation: 0
    precipitation_deposits: 0
    wind_intensity: 0
    fog_density: 0
    fog_distance: 0
    fog_falloff: 0
    wetness: 0

runtime:
  backend: "cosim"

agents:
  debug: false

  vehicle:
    sensing:
      perception:
        activate: false
        camera:
          visualize: 0
          num: 1
          positions: [[2.5, 0, 1.0, 0]]
        lidar:
          visualize: false

      localization:
        activate: true
        use_kalman: false
        dt: ${world.fixed_delta_seconds}
        debug_helper:
          show_animation: false

    map_manager:
      visualize: false
      activate: false

    v2x:
      # V2X only feeds platooning (cav_nearby search/match), which MARL
      # scenarios do not use; the search is O(N^2) noisy-position Python
      # per tick, a real cost on a CARLA step. Keep it off unless a
      # scenario actually platoons.
      enabled: false
      apply_lag: false

    safety_manager:
      print_message: false

    behavior:
      debug: false
      max_speed: 45
      tailgate_speed: 50
      speed_lim_dist: 5
      speed_decrease: 15
      safety_time: 4
      emergency_param: 0.4
      overtake_allowed: true
      collision_time_ahead: 1.5
      overtake_counter_recover: 35
      ignore_traffic_light: false
      sample_resolution: 1.0

      local_planner:
        buffer_size: 12
        trajectory_update_freq: 15
        waypoint_update_freq: 9
        min_dist: 2
        trajectory_dt: 0.10
        lookahead_steps: 3
        debug: true
        debug_trajectory: true

    controller:
      args:
        dt: ${world.fixed_delta_seconds}

outputs:
  root_dir: "artifacts"
  evaluation:
    mode: "summary"
    dir: "evaluation"
    keep_episode_summaries: 1000
    plot_interval: 5
    max_history_steps: 10000
  tensorboard:
    enabled: true
    dir: "tensorboard"
    mode: "episode_first"
    log_frequency: 100
    max_episodes_per_run: 100
    keep_last_runs: 5
  metrics_archive:
    enabled: true
    dir: "metrics_history"
    export_interval: 5

MARL:
  training: {}
