description: |-
  Canonical TD3 baseline for comparing intersection reward designs.
  Uses the simplified 8D state space so reward comparisons stay focused on the
  reward design instead of high-dimensional nearby-vehicle feature changes.

_extend_fields:
  - "world.seed"

world:
  seed: 5

agents:
  agent_type: "marl"

  marl:
    debug: false
    max_speed: 65
    emergency_param: 0.4
    ignore_traffic_light: true
    collision_time_ahead: 1.5

    local_planner:
      trajectory_update_freq: 5
      debug: false
      debug_trajectory: true

MARL:
  algorithm: "matd3"
  action_space:
    mode: speed_only
  reward_profile: "simple_progress_v1"

  state_dim: 8
  action_dim: 1

  matd3:
    features:
      rel_x: 1
      rel_y: 1
      speed: 1
      heading_angle: 1
      dist_to_intersection: 1
      dist_to_front_vehicle: 1
      lane_position: 1
      waypoint_buffer: 1

    conflict_encoder:
      type: "LSTM"
      input_size: 8
      hidden_size: 128
      num_layers: 1

    motion_planner:
      num_layers: 3
      input_dim: [136, 256, 128]
      output_dim: [256, 128, 1]

    learning_rate_actor: 5e-5
    learning_rate_critic: 5e-4
    tau: 0.005
    discount: 0.99
    policy_noise: 0.2
    noise_clip: 0.5
    exploration_noise: 0.3
    noise_decay: 0.999
    min_exploration_noise: 0.05
    policy_freq: 2
    batch_size: 128
    memory_size: 50000
    recency_ratio: 0.5
    clear_episodes: 5
    clear_keep_ratio: 0.8
    use_per: false
    max_action: 65.0
    min_action: 10.0
    warmup_steps: 0

  training:
    training_mode: false
    checkpoint_dir: "checkpoints/"
    save_freq: 5
    keep_checkpoints: 3
    load_checkpoint: "ral/td3_8d_300vph_v2"  # bundled RAL baseline (checkpoints/ral/manifest.json)
