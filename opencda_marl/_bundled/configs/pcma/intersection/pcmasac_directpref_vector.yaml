description: |-
  CARLA cooperative SAC using preference-conditioned MASAC with direct
  preference conditioning and a vector critic; 50 episodes on one seed.

world:
  seed: 3

agents:
  agent_type: "marl"

  marl:
    debug: false
    max_speed: 45
    emergency_param: 0.4
    ignore_traffic_light: true
    collision_time_ahead: 1.5

    local_planner:
      trajectory_update_freq: 5
      lookahead_steps: 3
      debug: false
      debug_trajectory: false

scenario:
  simulation:
    max_steps: 2400
    max_episodes: 50
  traffic:
    mode: "live"
    max_active_agents: 10

outputs:
  evaluation:
    mode: "disabled"
  tensorboard:
    enabled: true
    mode: "episode_first"
    log_frequency: 100
    max_episodes_per_run: 100
    keep_last_runs: 0
  metrics_archive:
    enabled: true
    export_interval: 1
    dir: "metrics_history/pcma_intersection_pcmasac_directpref_vector"

runtime:
  reset:
    enabled: true
    reset_frequency: 1
    auto_reset:
      enabled: true

MARL:
  algorithm: "pcmasac"
  reward_profile: "cooperative_intersection_v1"
  objective_mode: "cooperative_pref_v1"
  reward_mode: "objective_vector"
  state_dim: 11
  action_dim: 1
  action_space:
    mode: speed_only

  preference:
    profile: "mild_asymmetric_split"
    assignment: "entry_direction"
    injection: "state_augmentation"
    dim: 2

  pcmasac:
    pref_mode: "direct"
    critic_mode: "vector"
    pref_dim: 2
    features:
      rel_x: 1
      rel_y: 1
      position_x: 1
      position_y: 1
      lane_position: 1
      heading_angle: 1
      dist_to_intersection: 1
      dist_to_front_vehicle: 1
      waypoint_buffer: 1

    lstm_hidden_size: 128
    lstm_num_layers: 1
    actor_hidden_dims: [256, 256]
    critic_hidden_dims: [256, 256]
    learning_rate_actor: 3e-4
    learning_rate_critic: 3e-4
    learning_rate_alpha: 3e-4
    tau: 0.005
    gamma: 0.99
    auto_entropy_tuning: true
    target_entropy: -1.0
    init_alpha: 0.2
    log_std_min: -20
    log_std_max: 2
    memory_size: 5000
    batch_size: 64
    warmup_steps: 100
    max_action: 45.0
    min_action: 0.0

  training:
    training_mode: true
    save_checkpoints: true
    checkpoint_dir: "artifacts/checkpoints/pcma_intersection_pcmasac_directpref_vector"
    save_freq: 1
    keep_checkpoints: 1
    load_checkpoint: ""
