<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenCDA-MARL Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>OpenCDA-MARL Monitor</h1>
  <label>refresh <select id="refresh"><option value="0">off</option><option value="2000" selected>2 s</option><option value="5000">5 s</option><option value="15000">15 s</option></select></label>
  <label>smoothing <input id="smooth" type="number" min="0" max="0.99" step="0.05" value="0" style="width:60px"></label>
  <label>points <input id="maxpts" type="number" min="100" max="20000" step="100" value="1500" style="width:70px"></label>
  <label><input id="logy" type="checkbox"> log y</label>
  <span id="status" class="muted"></span>
</header>
<main>
  <aside>
    <div class="row"><input id="filter" type="text" placeholder="filter runs…" style="flex:1"><button id="reload" aria-label="Refresh now" title="Refresh now">↻</button></div>
    <h2>Runs <span id="runcount" class="muted"></span></h2>
    <div id="runs" role="group" aria-label="Runs"></div>
  </aside>
  <section>
    <h2>Tags</h2>
    <div class="row"><button id="pick-episode">Episode/*</button><button id="pick-loss">Loss/* Policy/*</button><button id="pick-none">none</button></div>
    <div id="tags" class="tags"></div>
    <h2>Charts</h2>
    <div id="charts" class="charts"></div>
    <h2 style="display:flex;align-items:center;gap:12px">Traffic view <span id="tvfor" class="muted"></span>
      <label class="muted" style="font-weight:400"><input id="tvon" type="checkbox" checked> live</label></h2>
    <div class="chart" style="max-width:820px"><canvas id="tv" role="img" aria-label="Schematic traffic view: lane lines and vehicle poses" style="width:100%;height:430px;display:block"></canvas>
      <div id="tvhud" class="muted" style="padding:3px 4px;font-size:11px">no run selected</div></div>
    <h2>Episodes <span id="epfor" class="muted"></span></h2>
    <div style="max-height:320px; overflow:auto"><table id="episodes"></table></div>
    <details><summary>Run metadata / config</summary><pre id="meta">—</pre></details>
  </section>
</main>
<script src="app.js"></script>
<script src="traffic.js"></script>
</body>
</html>
